enable_audio_bell no
#include color.ini

font_family      HackNerdFont
font_size 11

disable_ligatures never
url_color #BA0D0D
url_style curly

# --- NAVEGACIÓN DE VENTANAS ---
map ctrl+left neighboring_window left
map ctrl+right neighboring_window right
map ctrl+up neighboring_window up
map ctrl+down neighboring_window down

# --- PORTAPAPELES ---
map f1 copy_to_buffer a
map f2 paste_from_buffer a
map f3 copy_to_buffer b
map f4 paste_from_buffer b

# --- CURSOR Y MOUSE ---
cursor_shape beam
cursor_beam_thickness 1.8
mouse_hide_wait 3.0
detect_urls yes

# --- RENDIMIENTO ---
repaint_delay 10
input_delay 3
sync_to_monitor yes

# --- LAYOUTS Y DIVISIONES (NUEVO) ---
# Habilitamos splits para poder dividir manualmente, y otros para que ctrl+l tenga variedad
enabled_layouts splits,tall,fat,grid,stack

map ctrl+shift+z toggle_layout stack
# Rotar entre todos los layouts disponibles (el orden "aleatorio")
map ctrl+l next_layout

# Dividir verticalmente (una al lado de la otra)
map ctrl+enter launch --location=vsplit --cwd=current
# Dividir horizontalmente (una arriba de la otra)
map ctrl+} launch --location=hsplit --cwd=current

# --- APARIENCIA DE PESTAÑAS ---
tab_bar_style powerline
# inactive_tab_background #e06c75
# inactive_tab_foreground #000000
# active_tab_background #98c379
# tab_bar_margin_color black

# --- ATAJOS POR DEFECTO ---
#map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+t new_tab_with_cwd

# --- ENTORNO Y SISTEMA ---
background_opacity 0.8
shell zsh
# wayland_titlebar_color background
#hide_window_decorations yes


# BEGIN_KITTY_THEME
include dark-theme.auto.conf
# END_KITTY_THEMEbackground #000000
background_opacity 1.0
# background #000000
background_opacity 0.8
