monitor=HDMI-A-1,1680x1050@59.883,0x0,1
monitor=eDP-1,1920x1080@60.027,1680x0,1

# --- Variables de entorno (deben ir ANTES de cualquier exec-once) ---
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = QT_QPA_PLATFORMTHEME,qt6ct
env = GTK_THEME,adw-gtk3-dark

# Nvidia
env = LIBVA_DRIVER_NAME,nvidia
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct
env = __GL_VRR_ALLOWED,1
env = WLR_NO_HARDWARE_CURSORS,1

exec-once = /bin/bash -c 'systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE XDG_SESSION_DESKTOP HYPRLAND_INSTANCE_SIGNATURE && dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE XDG_SESSION_DESKTOP HYPRLAND_INSTANCE_SIGNATURE && systemctl --user start hyprland-session.target'
exec-once = /usr/libexec/polkit-gnome-authentication-agent-1

# --- Forzar Dark Mode a través de gsettings (con delay para asegurar D-Bus) ---
exec-once = sleep 1 && gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'
exec-once = sleep 1 && gsettings set org.gnome.desktop.interface gtk-theme 'adw-gtk3-dark'

exec-once = waybar
#exec-once = swaybg -i /home/kuro/Imágenes/fondo-pc.jpeg -m fill
exec-once = dunst
#exec-once = nm-applet &
#exec-once = blueman-applet &

# Inicializador de Wallpapers (Persistencia)
exec-once = ~/.config/hypr/scripts/init_wp.sh

# Demonio de auto-pausa
exec-once = ~/.config/hypr/scripts/wallpaper_control.sh

input {
    kb_layout = latam
    follow_mouse = 1
    natural_scroll = false
}

ecosystem {
    no_update_news = true
    no_donation_nag = true
}

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2

    col.active_border = rgb(b30000) rgb(000000) 45deg
    col.inactive_border = rgba(313244aa)
}

decoration {
    rounding = 8
    
    blur {
        enabled = true
        size = 3
        passes = 1
        new_optimizations = true
    }
}

animations {
    enabled = true

    # Curvas de velocidad Bezier avanzadas
    bezier = wind, 0.05, 0.9, 0.1, 1.05
    bezier = winSlide, 0.1, 0.9, 0.1, 1.05
    bezier = winIn, 0.1, 1.1, 0.1, 1.1
    bezier = winOut, 0.3, -0.3, 0, 1
    bezier = liner, 1, 1, 1, 1

    # Configuración de animaciones
    animation = windows, 1, 6, wind, slide
    animation = windowsIn, 1, 6, winIn, slide
    animation = windowsOut, 1, 5, winOut, slide
    animation = windowsMove, 1, 5, wind, slide
    animation = border, 1, 1, liner
    animation = borderangle, 1, 30, liner, loop
    animation = fade, 1, 8, default
    animation = workspaces, 1, 5, wind, slide
}

$mainMod = SUPER
$terminal = kitty
$browser = firefox
$fileManager = dolphin

# --- Apps principales ---
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, B, exec, $browser
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, SPACE, exec, rofi -show drun -show-icons


# --- Gestión de ventanas ---
bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT, Q, exec, hyprctl dispatch exit  # cierre forzado de sesión (con confirmación real, ver abajo)
bind = $mainMod, F, fullscreen,
bind = $mainMod, V, togglefloating,
bind = $mainMod, P, pseudo,               # modo pseudo-tiling (dwindle)
#bind = $mainMod, J, togglesplit,          # cambia orientación del split
bind = $mainMod SHIFT, RETURN, exec, kitty --session ~/.config/kitty/dashboard.session

# --- Captura de pantalla ---
bind = , PRINT, exec, grim -g "$(slurp)" - | wl-copy
bind = $mainMod, PRINT, exec, grim - | wl-copy

# --- Foco entre ventanas (flechas o vim-style) ---
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# --- Mover ventanas ---
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# --- Redimensionar ventanas ---
bind = $mainMod CTRL, left, resizeactive, -40 0
bind = $mainMod CTRL, right, resizeactive, 40 0
bind = $mainMod CTRL, up, resizeactive, 0 -40
bind = $mainMod CTRL, down, resizeactive, 0 40

# --- Workspaces ---
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# scroll entre workspaces con la rueda del mouse sobre la barra
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# --- Mouse: mover/resize ventanas flotantes con SUPER + click ---
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# --- Multimedia (funciona con la mayoría de laptops) ---
bindl = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindl = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindl = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# --- Screenshot con área + notificación ---
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" ~/Pictures/screenshot_$(date +%Y%m%d_%H%M%S).png

# --- Bloqueo de pantalla (necesitas hyprlock instalado) ---
bind = $mainMod SHIFT, L, exec, hyprlock

# --- Clipboard history (con cliphist que ya instalaste) ---
bind = $mainMod, C, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy

# --- Recargar waybar --- 
bind = $mainMod SHIFT, W, exec, killall waybar && waybar

# --- Reglas de capa (Blur y Transparencia para Waybar, Quickshell, Rofi) ---
layerrule = blur on, ignore_alpha 0.5, match:namespace waybar
layerrule = blur on, ignore_alpha 0.2, match:namespace quickshell
layerrule = blur on, ignore_alpha 0.2, match:namespace rofi

# --- Reglas para ventanas flotantes (Menús de red/sistema) ---
windowrule = float on, size 600 400, center on, animation slide, match:class ^(nmtui-float)$

# --- Reglas para el menú flotante de Bluetooth ---
windowrule = float on, size 600 450, center on, animation slide, match:class ^(blueman-manager)$

# --- Minimizar (mandar a workspace especial) ---
bind = $mainMod, M, movetoworkspacesilent, special:minimized
bind = $mainMod SHIFT, M, togglespecialworkspace, minimized

# --- Reglas para el selector de fondos ---
windowrule = float on, size 700 400, center on, animation slide, match:class ^(wallpaper-picker)$

# --- Lanzar selector de fondos gráfico ---
bind = $mainMod ALT, W, exec, ~/.config/hypr/scripts/wp_picker.sh
