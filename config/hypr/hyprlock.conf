# ~/.config/hypr/hyprlock.conf

background {
    monitor =
    path = screenshot
    blur_passes = 2
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

general {
    no_fade_in = false
    grace = 0
    hide_cursor = true
    text_trim = true
}

image {
    monitor =
    path = /home/kuro/Imágenes/kuro/kuro-perfil.png
    size = 150
    rounding = -1
    border_size = 4
    border_color = rgba(255, 255, 255, 0.8)
    rotate = 0
    reload_time = -1
    position = 0, 80
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 250, 60
    outline_thickness = 3
    dots_size = 0.26
    dots_spacing = 0.35
    dots_center = true
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(0, 0, 0, 0.5)
    font_color = rgb(200, 200, 200)
    fade_on_empty = true
    placeholder_text = <i>Contraseña...</i>
    hide_input = false
    position = 0, -120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M:%S")"
    color = rgba(255, 255, 255, 1.0)
    font_size = 90
    font_family = sans-serif
    position = 0, 300
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:43200000] echo "$(date +"%A, %d de %B")"
    color = rgba(255, 255, 255, 1.0)
    font_size = 25
    font_family = sans-serif
    position = 0, 200
    halign = center
    valign = center
}
